name: Build Check

on: push

jobs:
  build_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Arduino CLI のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 2. ESP32 ボードインデックスの追加とインストール
      - name: Install PlatformIO
        run: pip install platformio

      # 3. コンパイルチェック
      - name: Building test (PlatformIO)
        id: build
        continue-on-error: true
        run: pio run

      # 4. 成功時の README 更新
      - name: Update README on Success
        if: steps.build.outcome == 'success'
        run: |
          cat << 'EOF' > README.md
          <br />
          <br />
          <div align="center">

          # ⭕ 動 く ぞ ! ! !

          </div>
          <br />
          <br />
          EOF

      # 5. 失敗時の README 更新
      - name: Update README on Failure
        if: steps.build.outcome == 'failure'
        run: |
          cat << 'EOF' > README.md
          <br />
          <br />
          <div align="center">

          # ❌ や り な お し ! ! !

          </div>
          <br />
          <br />
          EOF

      # 6. コミット & プッシュ
      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: update README build status" && git push)

      # 7. ビルド失敗時はワークフロー自体も Fail にさせる
      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
