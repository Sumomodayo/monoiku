name: Build Check

on: push

jobs:
  build_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Building test in GCC / G++
        id: build
        continue-on-error: true
        run: |
          find . -type f -name '*.c' | xargs -r -t -L 1 gcc -fsyntax-only
          find . -type f \( -name '*.cpp' -o -name '*.cc' \) | xargs -r -t -L 1 g++ -fsyntax-only

      - name: Update README on Success
        if: steps.build.outcome == 'success'
        run: |
          cat << 'EOF' > README.md
          <br />
          <br />
          <div align="center">

          # ⭕ 動 く ぞ ! ! !

          </div>
          <br />
          <br />
          EOF

      - name: Update README on Failure
        if: steps.build.outcome == 'failure'
        run: |
          cat << 'EOF' > README.md
          <br />
          <br />
          <div align="center">

          # ❌ や り な お し ! ! !

          </div>
          <br />
          <br />
          EOF

      - name: Commit and Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: update README build status" && git push)

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
